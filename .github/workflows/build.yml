name: Build OverlayPad APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages & NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.2'
          cache-disabled: true

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --no-build-cache --rerun-tasks 2>&1 | tee build.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overlaypad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
