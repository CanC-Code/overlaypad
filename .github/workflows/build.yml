name: Build OverlayPad APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: '26.1.10909125'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.2'
          cache-disabled: true

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --no-build-cache --rerun-tasks 2>&1 | tee build.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overlaypad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
